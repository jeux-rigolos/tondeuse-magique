name: Déployer les jeux sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Vérifier la présence des jeux
        run: |
          test -f site/index.html
          test -f site/2d/index.html
          test -f site/3d/index.html
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
